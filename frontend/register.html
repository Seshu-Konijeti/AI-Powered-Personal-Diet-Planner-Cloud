<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Register | DietPlanner Cloud</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav>
  <a class="brand" href="index.html">🥗 DietPlanner Cloud</a>
  <div class="links"><a href="login.html">Login</a></div>
</nav>

<div class="container narrow">
  <div class="card">
    <h1>Create your account</h1>
    <p class="subtitle">Demo data only — do not use real personal or medical information.</p>

    <form id="registerForm">
      <label for="name">Full name</label>
      <input type="text" id="name" required placeholder="Demo User" />

      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" required minlength="8" placeholder="At least 8 characters" />

      <button type="submit">Register</button>
    </form>
    <div id="msg" class="msg" style="display:none;"></div>
    <p style="margin-top:16px; font-size:0.9rem;">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const button = e.target.querySelector("button[type=submit]");
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  button.disabled = true;
  button.textContent = "Please wait...";
  showMessage("msg", "Contacting server. On the free tier the first request can take up to a minute. Please don't click again.", "success");

  try {
    await apiRequest("/register", { method: "POST", body: { name, email, password } });
    showMessage("msg", "Registration successful! Redirecting to login...", "success");
    setTimeout(() => (window.location.href = "login.html"), 1200);
  } catch (err) {
    showMessage("msg", err.message, "error");
    button.disabled = false;
    button.textContent = "Register";
  }
});
</script>
</body>
</html>
