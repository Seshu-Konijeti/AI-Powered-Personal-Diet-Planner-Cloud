<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login | DietPlanner Cloud</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<nav>
  <a class="brand" href="index.html">🥗 DietPlanner Cloud</a>
  <div class="links"><a href="register.html">Register</a></div>
</nav>

<div class="container narrow">
  <div class="card">
    <h1>Welcome back</h1>
    <p class="subtitle">Log in to access your dashboard.</p>

    <form id="loginForm">
      <label for="email">Email</label>
      <input type="email" id="email" required placeholder="you@example.com" />

      <label for="password">Password</label>
      <input type="password" id="password" required placeholder="Your password" />

      <button type="submit">Login</button>
    </form>
    <div id="msg" class="msg" style="display:none;"></div>
    <p style="margin-top:16px; font-size:0.9rem;">New here? <a href="register.html">Create an account</a></p>
  </div>
</div>

<script src="js/api.js"></script>
<script>
const params = new URLSearchParams(window.location.search);
if (params.get("expired")) {
  showMessage("msg", "Your session expired. Please log in again.", "error");
}

document.getElementById("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  try {
    const data = await apiRequest("/login", { method: "POST", body: { email, password } });
    setToken(data.access_token);
    setCurrentUser(data.user);
    window.location.href = "dashboard.html";
  } catch (err) {
    showMessage("msg", err.message, "error");
  }
});
</script>
</body>
</html>
